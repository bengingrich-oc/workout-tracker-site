<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset password</title>
  <style>
    :root { --bg: #e9eff8; --card: #ffffff; --text: #0b1324; --muted: #5a6478; --accent: #1f6be0; --good: #0a8f65; --danger: #c9364a; --border: #d6deea; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0a0f1e; --card: #141a2c; --text: #ffffff; --muted: #a3abc0; --accent: #2d7ff9; --good: #2ee6a6; --danger: #ff7a86; --border: #2a3350; }
    }
    :root[data-theme="dark"] { --bg: #0a0f1e; --card: #141a2c; --text: #ffffff; --muted: #a3abc0; --accent: #2d7ff9; --good: #2ee6a6; --danger: #ff7a86; --border: #2a3350; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 56px 16px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.4px; }
    .muted { color: var(--muted); font-size: 15px; margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
    input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
    button { width: 100%; font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 14px; padding: 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .error { color: var(--danger); font-size: 15px; min-height: 22px; margin: 0 0 10px; }
    .done { color: var(--good); font-weight: 700; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Tandem</h1>
    <p class="muted" id="sub">Checking your link…</p>

    <form class="card" id="form" hidden>
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <p class="error" id="err" role="alert"></p>
      <button id="save" type="submit">Set new password</button>
    </form>

    <div class="card" id="result" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script>
    // The reset email links here with a short-lived session in the address.
    // This page only sets a new password for that account; nothing is stored.
    const SUPABASE_URL = 'https://eizqcwgekxzoommjzjrj.supabase.co';
    const PUBLISHABLE_KEY = 'sb_publishable_l_l4O3nEdCwqe3HVq6fpzw_ZGTXgKvp';

    const $ = (id) => document.getElementById(id);
    const show = (html, isError) => {
      $('form').hidden = true;
      $('sub').hidden = true;
      $('result').hidden = false;
      $('result').innerHTML = html;
      if (isError) $('result').style.color = 'var(--danger)';
    };
    const expired = () =>
      show('<p><strong>This link has expired or was already used.</strong></p><p class="muted" style="margin:0">Open Tandem, tap <strong>Forgot password?</strong> and send a new link. Use the newest email.</p>');

    const hash = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    if (hash.get('error') || query.get('error')) {
      expired();
    } else {
      const client = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY, {
        auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: false, autoRefreshToken: false },
      });
      client.auth.getSession().then(({ data }) => {
        // Keep the tokens out of the address bar and history.
        history.replaceState(null, '', location.pathname);
        if (!data.session) return expired();
        $('sub').textContent = 'Choose a new password for ' + (data.session.user.email || 'your account') + '.';
        $('form').hidden = false;
        $('pw').focus();
      });

      $('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = $('pw').value;
        if (pw.length < 8) return ($('err').textContent = 'Use at least 8 characters.');
        if (pw !== $('pw2').value) return ($('err').textContent = "The passwords don't match.");
        $('err').textContent = '';
        $('save').disabled = true;
        const { error } = await client.auth.updateUser({ password: pw });
        if (error) {
          $('save').disabled = false;
          $('err').textContent = /same|different/i.test(error.message) ? 'Pick a password you haven’t used here before.' : error.message;
          return;
        }
        await client.auth.signOut();
        show('<p class="done">Password updated.</p><p class="muted" style="margin:0">Open Tandem and sign in with your new password.</p>');
      });
    }
  </script>
</body>
</html>
